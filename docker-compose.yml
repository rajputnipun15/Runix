  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-runix}:${POSTGRES_PASSWORD:-runix_secret_dev}@postgres:5432/${POSTGRES_DB:-runix_dev}
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - runix-network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: runix-frontend
  #   ports:
  #     - "${APP_PORT:-3000}:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - runix-network

networks:
  runix-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
