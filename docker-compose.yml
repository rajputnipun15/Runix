version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: runix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runix_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-runix_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - runix-network

  redis:
    image: redis:7-alpine
    container_name: runix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - runix-network

  # backend:
